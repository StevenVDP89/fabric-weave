name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build and publish
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RAYFIN_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check that the tag, rayfin.base.yml and the changelog agree
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base_version=$(sed -n 's/^version: *//p' app/rayfin/rayfin.base.yml | head -n1 | tr -d '\r"' | xargs)
          top_heading=$(grep -m1 '^## ' CHANGELOG.md | tr -d '\r')
          changelog_version=$(printf '%s\n' "$top_heading" | sed -E -n 's/^## \[?([0-9][0-9A-Za-z.+-]*).*/\1/p')
          echo "tag: $tag | rayfin.base.yml: $base_version | top CHANGELOG heading: $top_heading"
          if [ "$base_version" != "$tag" ]; then
            echo "Tag v$tag does not match version $base_version in app/rayfin/rayfin.base.yml"; exit 1
          fi
          if [ "$changelog_version" != "$tag" ]; then
            echo "Tag v$tag does not match the top heading of CHANGELOG.md ($top_heading)"; exit 1
          fi
      - name: Build the package
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $asset = Join-Path $env:RUNNER_TEMP "fabric-weave-$version.zip"
          .\deployment\Build-Package.ps1 -OutputZipPath $asset
          "ASSET=$asset" >> $env:GITHUB_ENV
      - name: Check that the installer runs from the unpacked archive
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive -LiteralPath $env:ASSET -DestinationPath $unpacked
          $name = [IO.Path]::GetFileNameWithoutExtension($env:ASSET)
          Set-Location -LiteralPath (Join-Path $unpacked $name)
          node install.mjs --help > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node install.mjs --prepare-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'app\rayfin\rayfin.yml')) { throw 'The installer did not prepare rayfin.yml.' }
          $tests = Get-ChildItem -LiteralPath 'tools\test' -Filter '*.test.mjs' | ForEach-Object { $_.FullName }
          node --test @tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        run: |
          $checksum = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          Copy-Item -LiteralPath "$env:ASSET.sha256" -Destination $checksum
          "CHECKSUM=$checksum" >> $env:GITHUB_ENV
          Get-Content -LiteralPath $checksum
      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
